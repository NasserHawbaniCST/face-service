# Face service.
#
# Two ways to supply the settings (both work, they can be mixed):
#   * docker compose:  cp .env.example .env && edit it, then  docker compose up -d --build
#   * Portainer / any UI that injects variables: add them under "Environment variables" of the stack
#     (FACE_API_KEY_1, FACE_HMAC_SECRET_1, FACE_ALLOWED_IPS, FACE_DOMAIN, ...). No .env file is needed.
#
# Service only: published on ${FACE_BIND}:8765 (loopback by default).
#
# With automatic HTTPS (Caddy + Let's Encrypt; needs a DNS name pointing at this server and
# ports 80/443 open):
#   docker compose --profile tls up -d --build        # or, in Portainer: env var COMPOSE_PROFILES=tls
# then the gateway uses  https://$FACE_DOMAIN  and you may keep FACE_BIND=127.0.0.1.
name: face-service

services:
  face:
    build: .
    image: face-service:1.0.0
    restart: unless-stopped
    env_file:
      - path: .env
        required: false        # Portainer / CI: variables come from the stack environment instead
    environment:
      # pass-through of the stack/shell variables (an empty value means "not set" for the app)
      FACE_API_KEY_1: ${FACE_API_KEY_1:-}
      FACE_HMAC_SECRET_1: ${FACE_HMAC_SECRET_1:-}
      FACE_API_KEY_2: ${FACE_API_KEY_2:-}
      FACE_HMAC_SECRET_2: ${FACE_HMAC_SECRET_2:-}
      FACE_HMAC_SECRET: ${FACE_HMAC_SECRET:-}
      FACE_ALLOWED_IPS: ${FACE_ALLOWED_IPS:-}
      FACE_TRUSTED_PROXIES: ${FACE_TRUSTED_PROXIES:-}
      FACE_WORKERS: ${FACE_WORKERS:-2}
      FACE_CV_THREADS: ${FACE_CV_THREADS:-1}
      FACE_MAX_QUEUE: ${FACE_MAX_QUEUE:-}
      FACE_REQUEST_TIMEOUT: ${FACE_REQUEST_TIMEOUT:-20}
      FACE_RATE_LIMIT_PER_MIN: ${FACE_RATE_LIMIT_PER_MIN:-120}
      FACE_AUTH_FAIL_LIMIT_PER_MIN: ${FACE_AUTH_FAIL_LIMIT_PER_MIN:-30}
      FACE_MAX_BODY_BYTES: ${FACE_MAX_BODY_BYTES:-4194304}
      FACE_MAX_FRAMES: ${FACE_MAX_FRAMES:-6}
      FACE_MAX_FRAME_BYTES: ${FACE_MAX_FRAME_BYTES:-409600}
      FACE_TS_TOLERANCE: ${FACE_TS_TOLERANCE:-60}
      FACE_LOG_LEVEL: ${FACE_LOG_LEVEL:-INFO}
    ports:
      # loopback by default: expose to the network ONLY behind TLS (Caddy / nginx) or a private network
      - "${FACE_BIND:-127.0.0.1}:8765:8765"
    read_only: true            # nothing is ever written: the service is stateless
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ---- optional TLS front (profile "tls") -----------------------------------
  caddy:
    profiles: ["tls"]
    image: caddy:2
    restart: unless-stopped
    depends_on:
      face:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      # compose interpolates EVERY service, even one whose profile is off, so this must have a
      # default (the old "required variable" form made a deploy without FACE_DOMAIN fail).
      FACE_DOMAIN: ${FACE_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  caddy_data:
  caddy_config:
